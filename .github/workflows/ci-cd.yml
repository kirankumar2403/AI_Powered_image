name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # BACKEND CI
  # ============================================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: iqd
          POSTGRES_PASSWORD: iqd
          POSTGRES_DB: image_quality

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U iqd -d image_quality"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://iqd:iqd@127.0.0.1:5432/image_quality
      PYTHONPATH: backend
      MODEL_PATH: models/quality_pipeline.joblib

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------------
      # Check model
      # --------------------------------------------------------

      - name: Check ML model
        run: |
          echo "Checking model file..."
          ls -lh models/

          if [ ! -f "models/quality_pipeline.joblib" ]; then
            echo "ERROR: ML model not found!"
            exit 1
          fi

          echo "ML model found successfully."


      # --------------------------------------------------------
      # Python syntax
      # --------------------------------------------------------

      - name: Check Python syntax
        run: |
          python -m compileall backend


      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------

      - name: Run backend tests
        run: |
          pytest backend/tests -q


      # --------------------------------------------------------
      # Docker build
      # --------------------------------------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag ecap-backend:ci \
            .


  # ============================================================
  # FRONTEND CI
  # ============================================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      # --------------------------------------------------------
      # Build frontend
      # --------------------------------------------------------

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://ai-powered-image-1.onrender.com
        run: |
          npm run build


      # --------------------------------------------------------
      # Docker build
      # --------------------------------------------------------

      - name: Build frontend Docker image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --tag ecap-frontend:ci \
            frontend